name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    name: Lean build + axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (pinned by proofs/lean-toolchain)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: No sorry/admit in accepted modules
        run: |
          if grep -rnw -e sorry -e admit proofs/Analog --include='*.lean' | grep -v Audit.lean; then
            echo '::error::sorry/admit found in proofs/Analog'; exit 1
          fi
      - name: Mathlib cache + build (return code is lake's)
        working-directory: proofs
        run: |
          lake exe cache get
          lake build
      - name: Axiom audit (standard axioms only)
        working-directory: proofs
        shell: bash
        run: |
          set +e
          lake env lean Analog/Audit.lean > /tmp/audit.txt 2>&1
          audit_rc=$?
          set -e
          cat /tmp/audit.txt
          if [ "$audit_rc" -ne 0 ]; then
            echo "::error::Lean audit failed with exit code $audit_rc"
            exit "$audit_rc"
          fi
          if ! grep -Eq 'depends on axioms:|does not depend on any axioms' /tmp/audit.txt; then
            echo '::error::Lean audit emitted no theorem audit results'; exit 1
          fi
          if grep -Ev "^'[^']+' (depends on axioms: \[((propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*)?\]|does not depend on any axioms)$" /tmp/audit.txt; then
            echo '::error::unexpected or non-standard axiom audit output'; exit 1
          fi

  contracts:
    name: Legacy contract/fixture JSON syntax (not schema validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON validity
        run: python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('contracts/*.json') + glob.glob('data/fixtures/*.json')]; print('all contract/fixture JSON parses')"

  contract-validation:
    name: Contract schema validation + ARL recompute (W10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validators
        run: python -m pip install jsonschema==4.23.0 pyyaml==6.0.2
      - name: Validate objectives, site fixtures, ARL rule (with self-test)
        run: python scripts/validate_contracts.py --self-test
