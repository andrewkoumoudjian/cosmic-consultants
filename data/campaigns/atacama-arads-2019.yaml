objectivesExercised:
  - objectiveId: null
    text: Robotic drilling, sample handling, and life-search protocols in a Mars analog environment
    quote: >-
      The goals of this field experiment were both scientific and operational with the desire to demonstrate the performance of the drilling, sample handling, and the life search protocols, including the analysis of samples with flight prototype onboard instruments.
    sourceRef: arads-2019-article
publishedConstraints:
  - what: Command cycles to drill and deliver the deepest sample
    value: 55
    unit: command cycles to 80 cm depth
    quote: >-
      The deepest sample that was acquired with fully remote operations required 55 command cycles to drill to 80 cm depth with sample collection and delivery to 3 instruments.
    sourceRef: arads-2019-article
outcome:
  - kind: worked
    text: The field demonstration detected biomolecules in the deep basin samples.
    quote: >-
      Sample analysis from the SOLID instrument detected the presence of various biomolecules in the deep basin samples, with the strongest signatures coming from the 10- to 20-cm-depth sample.
    sourceRef: arads-2019-article
  - kind: lesson
    text: The paper reports that technical problems may have prevented analysis of shallower-basin samples.
    quote: >-
      No signatures were detected in samples from the shallower basin although technical problems occurred that may have prevented successful analysis of those samples.
    sourceRef: arads-2019-article
