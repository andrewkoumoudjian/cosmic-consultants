objectivesExercised:
  - objectiveId: null
    text: Isolated crew and habitat microbiome monitoring for future Moon or Mars outposts
    quote: >-
      Herein, we used the Hawaii Space Exploration Analog and Simulation IV (HI-SEAS IV) mission, a 1 year-long isolation study, to investigate microbial transfer between crew and habitat, in order to understand adverse developments which may occur in a future outpost on the Moon or Mars.
    sourceRef: hiseas-iv-article
publishedConstraints:
  - what: Simulated communication delay
    value: 20
    unit: minutes each way
    quote: >-
      The crew was physically isolated from other human beings for the whole mission duration and communications had a high latency (20-min delay in both directions).
    sourceRef: hiseas-iv-article
outcome:
  - kind: worked
    text: The study found stable surface microbiome composition alongside changing crew skin microbiomes.
    quote: >-
      The microbiome composition and diversity associated with abiotic surfaces was found to be rather stable
    sourceRef: hiseas-iv-article
  - kind: lesson
    text: The study linked delayed microbiome homogenization to a malfunctioning sanitary facility.
    quote: >-
      quantitative and qualitative data supported the observation of a delayed longitudinal microbial homogenization between crew and habitat surfaces which was mainly caused by a malfunctioning sanitary facility.
    sourceRef: hiseas-iv-article
