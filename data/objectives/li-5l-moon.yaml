# P0 objective row (W10, #15). Mapping is our interpretation of NASA's text.
objectiveId: LI-5L
body: moon
title: Precision landing — shortened by us
earthTestableComponent: Hazard-detection and terrain-relative-navigation tests over rough terrain at low sun angle.
rateable: true
requiredDimensions: [terrain, illumination]
mapping:
  status: proposed
  sources:
    - docs/research/07-spaceapps-rules-and-m2m-objectives.md §2.1
    - docs/research/08-landing-site-feature-set.md (LI-5L - slope_100m, sun_elev_min, illum_frac_avg, earth_vis_frac)
toleranceSource:
  envelopeId: moon-south-pole-v0
  note: "Moon south-pole envelope v0 (data/envelopes/moon-south-pole-v0.json). It covers both required dimensions: terrain (max slope over a 100 m baseline, 0-10 deg) and illumination (surface sunlit for the whole stay window, 100 percent). Citations are in data/envelopes/README.md."
notTestableOnEarth:
  - mismatch: gravity
    why: Descent and touchdown dynamics depend on lunar gravity (about 0.17 g).
  - mismatch: pressureRegime
    why: In vacuum, engine plumes blast the surface differently than in Earth's air.
