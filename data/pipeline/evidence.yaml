  emit_min_hydration_bd_med:    {kind: observed, support: "EMIT L2B V002 median band depth for hydration mineral family (0.001-wide histogram)", family: nasa-emit-l2b}
  emit_min_hydration_px:        {kind: computed, role: diagnostic, support: "EMIT L2B V002 pixel-observation count for hydration mineral family", family: nasa-emit-l2b}
  emit_min_fe_mg_smectite_share:  {kind: observed, support: "EMIT L2B V002 share of identified pixels in Fe/Mg-smectite mineral family (60 m -> H3 res-4)", family: nasa-emit-l2b}
  emit_min_fe_mg_smectite_bd_med: {kind: observed, support: "EMIT L2B V002 median band depth for Fe/Mg-smectite mineral family", family: nasa-emit-l2b}
  emit_min_fe_mg_smectite_px:     {kind: computed, role: diagnostic, support: "EMIT L2B V002 pixel-observation count for Fe/Mg-smectite mineral family", family: nasa-emit-l2b}
  emit_min_al_oh_share:         {kind: observed, support: "EMIT L2B V002 share of identified pixels in Al-OH (kaolinite/illite) mineral family (60 m -> H3 res-4)", family: nasa-emit-l2b}
  emit_min_al_oh_bd_med:        {kind: observed, support: "EMIT L2B V002 median band depth for Al-OH mineral family", family: nasa-emit-l2b}
  emit_min_al_oh_px:            {kind: computed, role: diagnostic, support: "EMIT L2B V002 pixel-observation count for Al-OH mineral family", family: nasa-emit-l2b}
  emit_min_sulfate_share:       {kind: observed, support: "EMIT L2B V002 share of identified pixels in sulfate (gypsum) mineral family (60 m -> H3 res-4)", family: nasa-emit-l2b}
  emit_min_sulfate_bd_med:      {kind: observed, support: "EMIT L2B V002 median band depth for sulfate mineral family", family: nasa-emit-l2b}
  emit_min_sulfate_px:          {kind: computed, role: diagnostic, support: "EMIT L2B V002 pixel-observation count for sulfate mineral family", family: nasa-emit-l2b}
  emit_min_carbonate_share:     {kind: observed, support: "EMIT L2B V002 share of identified pixels in carbonate (calcite/dolomite) mineral family (60 m -> H3 res-4)", family: nasa-emit-l2b}
  emit_min_carbonate_bd_med:    {kind: observed, support: "EMIT L2B V002 median band depth for carbonate mineral family", family: nasa-emit-l2b}
  emit_min_carbonate_px:        {kind: computed, role: diagnostic, support: "EMIT L2B V002 pixel-observation count for carbonate mineral family", family: nasa-emit-l2b}
  emit_min_mafic_bd_1um_share:  {kind: observed, support: "EMIT L2B V002 share of identified pixels in Fe2+/olivine 1 um mineral family (60 m -> H3 res-4)", family: nasa-emit-l2b}
  emit_min_mafic_bd_1um_bd_med: {kind: observed, support: "EMIT L2B V002 median band depth for Fe2+/olivine 1 um mineral family", family: nasa-emit-l2b}
  emit_min_mafic_bd_1um_px:     {kind: computed, role: diagnostic, support: "EMIT L2B V002 pixel-observation count for Fe2+/olivine 1 um mineral family", family: nasa-emit-l2b}
  emit_min_dust_proxy_share:    {kind: observed, support: "EMIT L2B V002 share of identified pixels in Fe3+ iron-oxide dust-proxy family (NOT TES DCI)", family: nasa-emit-l2b}
  emit_min_dust_proxy_bd_med:   {kind: observed, support: "EMIT L2B V002 median band depth for Fe3+ iron-oxide dust-proxy family", family: nasa-emit-l2b}
  emit_min_dust_proxy_px:       {kind: computed, role: diagnostic, support: "EMIT L2B V002 pixel-observation count for Fe3+ iron-oxide dust-proxy family", family: nasa-emit-l2b}
