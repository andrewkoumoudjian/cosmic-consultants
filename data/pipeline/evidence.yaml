  vcf_percent_nontree_vegetation_pct_median: {kind: observed, support: "MOD44B v061 A2025 non-tree vegetation %, hexagon median over 0.05 deg lattice means", family: modis-mod44b}
  vcf_percent_nonvegetated_pct_median:      {kind: observed, support: "MOD44B v061 A2025 non-vegetated (bare) %, hexagon median over 0.05 deg lattice means", family: modis-mod44b}
  vcf_percent_tree_cover_pct_mean:          {kind: observed, support: "MOD44B v061 A2025 tree cover %, exact hexagon mean of valid 250 m pixels", family: modis-mod44b}
  vcf_percent_nontree_vegetation_pct_mean:  {kind: observed, support: "MOD44B v061 A2025 non-tree vegetation %, exact hexagon mean of valid 250 m pixels", family: modis-mod44b}
  vcf_percent_nonvegetated_pct_mean:        {kind: observed, support: "MOD44B v061 A2025 non-vegetated (bare) %, exact hexagon mean of valid 250 m pixels", family: modis-mod44b}
