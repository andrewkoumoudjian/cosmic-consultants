  vcf_percent_nontree_vegetation_valid_native_px: {kind: computed, role: diagnostic, support: "MOD44B v061 valid 250 m pixel count in hexagon, non-tree vegetation", family: modis-mod44b}
  vcf_percent_nonvegetated_valid_native_px: {kind: computed, role: diagnostic, support: "MOD44B v061 valid 250 m pixel count in hexagon, non-vegetated", family: modis-mod44b}
