[project]
name = "planner"
version = "0.1.0"
description = "Mission planner engine (W7, #20): L1/L1m/L2/L3 -> L4 + site plans. No site scores (AGENTS.md rule 4)."
requires-python = ">=3.12"
dependencies = [
  "pyarrow==18.1.0",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
test = ["jsonschema==4.23.0", "h3==4.1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]
