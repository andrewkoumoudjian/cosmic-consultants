[project]
name = "p0ingest"
version = "0.1.0"
description = "W6 (#19): P0 Earth measurements on a global H3 grid, from hashed snapshots"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h3==4.1.2",
  "numpy==2.1.3",
  "pyarrow==18.1.0",
  "pyhdf==0.11.6",
  "netCDF4==1.7.2",
  "rasterio==1.4.3",
  "pyyaml==6.0.2",
  "requests==2.32.3",
]

[project.scripts]
p0ingest = "p0ingest.cli:main"

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p0ingest"]
